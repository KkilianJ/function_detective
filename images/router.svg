<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1130" viewBox="0 0 1600 1130" role="img" aria-labelledby="title desc">
  <title id="title">Router outputs and downstream triggers</title>
  <desc id="desc">Each router detector is mapped to its question, Profile output, and downstream effect.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2f9"/>
    </linearGradient>
    <linearGradient id="navyGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#233a63"/><stop offset="1" stop-color="#16233f"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#1e293b" flood-opacity="0.12"/>
    </filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
      .h1{font-size:30px;font-weight:700;fill:#0f172a;letter-spacing:-.2px}
      .h2{font-size:18px;font-weight:700;fill:#fff}
      .name{font-size:18px;font-weight:700;fill:#233a63}
      .body{font-size:15.5px;fill:#475569}
      .small{font-size:14px;fill:#64748b}
      .row{fill:#fff;stroke:#e2e8f2;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1600" height="1130" fill="url(#bgGrad)" rx="24"/>
  <text class="h1" x="60" y="58">Router: detector → Profile field → downstream trigger</text>

  <rect x="55" y="98" width="1490" height="58" rx="14" fill="url(#navyGrad)" filter="url(#shadow)"/>
  <text class="h2" x="85" y="134">Detector</text><text class="h2" x="310" y="134">Question answered</text><text class="h2" x="730" y="134">Profile output</text><text class="h2" x="1055" y="134">What it changes</text>

  <rect class="row" x="55" y="176" width="1490" height="108" rx="14" filter="url(#shadow)"/><rect x="55" y="176" width="6" height="108" rx="3" fill="#4f5fe8"/><text class="name" x="85" y="218">Domain</text><text class="body" x="310" y="213"><tspan x="310">Where is f defined?</tspan><tspan x="310" dy="24">Integer-only? Complex? Overflow?</tspan></text><text class="body" x="730" y="213"><tspan x="730">legal_points, errors, domain_note,</tspan><tspan x="730" dy="24">integer_only, accepts_complex, overflow</tspan></text><text class="body" x="1055" y="213"><tspan x="1055">Restricts all later probes; changes planner.</tspan><tspan x="1055" dy="24">Complex behaviour becomes a structural filter.</tspan></text>

  <rect class="row" x="55" y="300" width="1490" height="108" rx="14" filter="url(#shadow)"/><rect x="55" y="300" width="6" height="108" rx="3" fill="#4f5fe8"/><text class="name" x="85" y="342">Parity</text><text class="body" x="310" y="342">Is f even, odd, or neither?</text><text class="body" x="730" y="342">parity</text><text class="body" x="1055" y="334"><tspan x="1055">Adds symmetric observation pairs.</tspan><tspan x="1055" dy="24">Rejects candidates with the wrong parity.</tspan></text>

  <rect class="row" x="55" y="424" width="1490" height="108" rx="14" filter="url(#shadow)"/><rect x="55" y="424" width="6" height="108" rx="3" fill="#4f5fe8"/><text class="name" x="85" y="466">Polynomial</text><text class="body" x="310" y="459"><tspan x="310">Do finite differences identify a degree</tspan><tspan x="310" dy="24">that also extrapolates?</tspan></text><text class="body" x="730" y="466">poly_degree / poly_is_none</text><text class="body" x="1055" y="458"><tspan x="1055">Confirmed degree reduces magnitude sweep;</tspan><tspan x="1055" dy="24">adds far cross-checks; suppresses vision.</tspan></text>

  <rect class="row" x="55" y="548" width="1490" height="108" rx="14" filter="url(#shadow)"/><rect x="55" y="548" width="6" height="108" rx="3" fill="#0f9d63"/><text class="name" x="85" y="590">Growth / ODE</text><text class="body" x="310" y="583"><tspan x="310">Which transform becomes linear?</tspan><tspan x="310" dy="24">Which derivative ratio stabilises?</tspan></text><text class="body" x="730" y="583"><tspan x="730">growth, growth_r2, ode_family,</tspan><tspan x="730" dy="24">ode_parameter</tspan></text><text class="body" x="1055" y="583"><tspan x="1055">Adds measured family evidence.</tspan><tspan x="1055" dy="24">Established family suppresses vision.</tspan></text>

  <rect class="row" x="55" y="672" width="1490" height="108" rx="14" filter="url(#shadow)"/><rect x="55" y="672" width="6" height="108" rx="3" fill="#0f9d63"/><text class="name" x="85" y="714">Curvature</text><text class="body" x="310" y="707"><tspan x="310">What is the sign of f''?</tspan><tspan x="310" dy="24">Where does the sign change?</tspan></text><text class="body" x="730" y="707"><tspan x="730">second_derivative, value,</tspan><tspan x="730" dy="24">inflections</tspan></text><text class="body" x="1055" y="707"><tspan x="1055">Adds probes around inflections.</tspan><tspan x="1055" dy="24">Rejects candidates with wrong curvature there.</tspan></text>

  <rect class="row" x="55" y="796" width="1490" height="108" rx="14" filter="url(#shadow)"/><rect x="55" y="796" width="6" height="108" rx="3" fill="#0f9d63"/><text class="name" x="85" y="838">Period</text><text class="body" x="310" y="831"><tspan x="310">Does an FFT proposal survive the</tspan><tspan x="310" dy="24">f(x+T)-f(x) constancy check?</tspan></text><text class="body" x="730" y="838">period / period_tested</text><text class="body" x="1055" y="831"><tspan x="1055">Adds triples spaced by T.</tspan><tspan x="1055" dy="24">Confirmed period suppresses vision.</tspan></text>

  <rect class="row" x="55" y="920" width="1490" height="108" rx="14" filter="url(#shadow)"/><rect x="55" y="920" width="6" height="108" rx="3" fill="#d9770f"/><text class="name" x="85" y="962">2D structure</text><text class="body" x="310" y="955"><tspan x="310">Are x and y interchangeable?</tspan><tspan x="310" dy="24">Do they interact? What do slices show?</tspan></text><text class="body" x="730" y="955"><tspan x="730">symmetric, separable,</tspan><tspan x="730" dy="24">slices[x], slices[y]</tspan></text><text class="body" x="1055" y="955"><tspan x="1055">Interaction adds off-diagonal probes.</tspan><tspan x="1055" dy="24">Symmetry filters; resolved slice suppresses vision.</tspan></text>

  <rect x="55" y="1054" width="1490" height="60" rx="14" fill="#fff" stroke="#e2e8f2" stroke-width="1.5"/>
  <text class="small" x="80" y="1078">Cross-check: incompatible independent results are stored in <tspan font-family="Menlo,monospace">Profile.conflicts</tspan> → vision is warranted on round 1 when enabled.</text>
  <text class="small" x="80" y="1100">All detector exceptions are caught. The field stays UNKNOWN and the run continues.</text>
</svg>
